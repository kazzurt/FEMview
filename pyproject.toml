[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "femview"
version = "0.1.0"
description = "Read-only structural and RF finite element results workbench"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["mechfea>=0.1,<0.2", "numpy>=2", "scipy>=1.14", "pyvista>=0.49", "pyvistaqt>=0.13", "PySide6>=6.12", "qtpy>=2", "matplotlib>=3.10"]

[tool.setuptools.packages.find]
include = ["fempost*"]

[tool.setuptools.package-data]
fempost = ["resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
