name: Windows viewer regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          path: FEMview
      - uses: actions/checkout@v4
        with:
          repository: kazzurt/MechFEA
          ref: 0690840e21bc11a86d94eb365ce35d4c1aed27a3
          path: MechFEA
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install uv
      - name: Install exact standalone interpreter
        run: uv python install 3.12.11
      - name: Install pinned project environment
        run: |
          $python312 = (uv python find 3.12.11).Trim()
          ./setup.ps1 -Python $python312
        working-directory: FEMview
      - name: Configure hosted software OpenGL
        run: ./tools/ci-software-opengl.ps1
        working-directory: FEMview
      - run: ./.venv/Scripts/python.exe -m pytest -q
        working-directory: FEMview
